# =============================================================================
# ADSVIO AGENCY - Netlify configuration
#
# Static site, no build step. Everything below is redirects and headers.
#
# ORDER MATTERS. Netlify applies the FIRST matching redirect and stops, so the
# query-parameter rules have to come before the bare-path rules that would
# otherwise swallow them.
# =============================================================================

[build]
  publish = "."
  command = ""

# =============================================================================
# SERVERLESS FUNCTIONS
#
# The site itself still has no build step. This exists only so Netlify installs
# the dependencies that netlify/functions needs - nothing here reaches the
# browser, and no public page gained a byte.
#
# GEMINI_API_KEY is NOT here and must never be. It is set in the Netlify UI
# under Site configuration → Environment variables, and read at runtime via
# process.env. Anything written into this file is committed to GitHub.
# =============================================================================
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify serves /en/about from en/about.html automatically. Stated here so
# nobody switches it off by accident while tidying.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true


# =============================================================================
# 0. DO NOT SERVE SERVER-SIDE SOURCE AS STATIC FILES
#
# publish = "." means the whole repository is the publish directory, so the
# function source and the installed dependencies sit inside it. Netlify's own
# guidance is to keep the functions directory outside the publish directory,
# which is not possible here without restructuring the entire site - so these
# rules deny the paths instead.
#
# This is not where the key is protected: the key is never written to any file,
# it is read from the environment at runtime. This is defence in depth, and it
# stops anyone reading the function's logic or walking node_modules.
#
# These are FIRST because the first matching rule wins. /.netlify/functions/*
# is a different path (leading dot) and is handled by Netlify before redirects
# run, so the generator is unaffected.
# =============================================================================

# Internal working material must not be served from the repository publish root.
# Forced 404s override existing files; robots.txt is not access protection.
[[redirects]]
  from = "/PLACEHOLDERS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SHOT-LIST.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SEO-AI-DISCOVERABILITY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sources/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/en/blog/_post-template"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/en/blog/_post-template.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true


# =============================================================================
# 1. KILL THE ?lang= PARAMETERS
#
# The old site served identical content at /?lang=en and /?lang=fr. Those
# duplicates split the ranking signals across two URLs for every page, which
# is the single most valuable technical fix on this list.
#
# force = true so the rule wins even when a real file exists at that path.
# =============================================================================

# Neutral root and historical root ?lang= URLs are handled by the root-only
# language edge function using temporary, uncached redirects. Form POSTs pass
# through. No static permanent redirect may override that visitor decision.

[[redirects]]
  from = "/about"
  query = { lang = "en" }
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  query = { lang = "fr" }
  to = "/fr/about"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  query = { lang = "en" }
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  query = { lang = "fr" }
  to = "/fr/about"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  query = { lang = "en" }
  to = "/en/services/"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  query = { lang = "fr" }
  to = "/fr/services/"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  query = { lang = "en" }
  to = "/en/services/"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  query = { lang = "fr" }
  to = "/fr/services/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  query = { lang = "en" }
  to = "/en/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  query = { lang = "fr" }
  to = "/fr/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  query = { lang = "en" }
  to = "/en/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  query = { lang = "fr" }
  to = "/fr/contact"
  status = 301
  force = true

