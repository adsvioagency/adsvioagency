# =============================================================================
# ADSVIO AGENCY — Netlify configuration
#
# Static site, no build step. Everything below is redirects and headers.
#
# ORDER MATTERS. Netlify applies the FIRST matching redirect and stops, so the
# query-parameter rules have to come before the bare-path rules that would
# otherwise swallow them.
# =============================================================================

[build]
  publish = "."
  command = ""

# =============================================================================
# SERVERLESS FUNCTIONS
#
# The site itself still has no build step. This exists only so Netlify installs
# the dependencies that netlify/functions needs — nothing here reaches the
# browser, and no public page gained a byte.
#
# GEMINI_API_KEY is NOT here and must never be. It is set in the Netlify UI
# under Site configuration → Environment variables, and read at runtime via
# process.env. Anything written into this file is committed to GitHub.
# =============================================================================
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify serves /en/about from en/about.html automatically. Stated here so
# nobody switches it off by accident while tidying.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true


# =============================================================================
# 0. DO NOT SERVE SERVER-SIDE SOURCE AS STATIC FILES
#
# publish = "." means the whole repository is the publish directory, so the
# function source and the installed dependencies sit inside it. Netlify's own
# guidance is to keep the functions directory outside the publish directory,
# which is not possible here without restructuring the entire site — so these
# rules deny the paths instead.
#
# This is not where the key is protected: the key is never written to any file,
# it is read from the environment at runtime. This is defence in depth, and it
# stops anyone reading the function's logic or walking node_modules.
#
# These are FIRST because the first matching rule wins. /.netlify/functions/*
# is a different path (leading dot) and is handled by Netlify before redirects
# run, so the generator is unaffected.
# =============================================================================

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true


# =============================================================================
# 1. KILL THE ?lang= PARAMETERS
#
# The old site served identical content at /?lang=en and /?lang=fr. Those
# duplicates split the ranking signals across two URLs for every page, which
# is the single most valuable technical fix on this list.
#
# force = true so the rule wins even when a real file exists at that path.
# =============================================================================

[[redirects]]
  from = "/"
  query = { lang = "en" }
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { lang = "fr" }
  to = "/fr/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  query = { lang = "en" }
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  query = { lang = "fr" }
  to = "/fr/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  query = { lang = "en" }
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  query = { lang = "fr" }
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  query = { lang = "en" }
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  query = { lang = "fr" }
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  query = { lang = "en" }
  to = "/en/services/website-design"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  query = { lang = "fr" }
  to = "/en/services/website-design"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  query = { lang = "en" }
  to = "/en/services/website-design"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  query = { lang = "fr" }
  to = "/en/services/website-design"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  query = { lang = "en" }
  to = "/en/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  query = { lang = "fr" }
  to = "/fr/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  query = { lang = "en" }
  to = "/en/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  query = { lang = "fr" }
  to = "/fr/contact"
  status = 301
  force = true

# NOTE ON ?lang=fr
# /fr/ covers the conversion path: home, offer and contact. Those three
# parameters now land on their French equivalents. The remaining two —
# /about?lang=fr and /services?lang=fr — still go to English, because no
# French about or services page exists. Point them at /fr/ equivalents as
# those pages are built.


# =============================================================================
# 2. LANGUAGE ROOT
# =============================================================================

[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/en/"
  status = 301
  force = true


# =============================================================================
# 3. LEGACY FLAT URLS
# The old site had everything at the root. These keep whatever authority
# those URLs earned.
# =============================================================================

[[redirects]]
  from = "/about"
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/en/about"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/en/services/website-design"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/en/services/website-design"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/en/contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/en/contact"
  status = 301
  force = true

# Convenience paths people type or that get shared without the /en/ prefix.
[[redirects]]
  from = "/offer"
  to = "/en/offer"
  status = 301

[[redirects]]
  from = "/work"
  to = "/en/work"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/en/blog/"
  status = 301

[[redirects]]
  from = "/guides"
  to = "/en/guides/caribbean-business-online"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/en/privacy"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/en/terms"
  status = 301

[[redirects]]
  from = "/checklist"
  to = "/en/checklist"
  status = 301

# French lives at /fr/. /french and /fr are what people actually type.
[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301

[[redirects]]
  from = "/french"
  to = "/fr/"
  status = 301


# =============================================================================
# 4. SECURITY HEADERS
# =============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control    = "off"

# NOTE ON CONTENT-SECURITY-POLICY
# Not set, deliberately. A CSP tight enough to be worth having would have to
# allow the TidyCal iframe, Google Analytics and the Meta pixel, and getting
# it wrong silently breaks the booking embed rather than showing an error.
# Worth adding in report-only mode first, reading the reports for a fortnight,
# then enforcing. Tracked in PLACEHOLDERS.md.


# =============================================================================
# 5. CACHING
# =============================================================================

# CSS and JS filenames are not fingerprinted, so they must revalidate or a
# deploy will not reach visitors who already have them.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts and images never change under the same filename.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML revalidates on every request so edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/xml; charset=utf-8"
